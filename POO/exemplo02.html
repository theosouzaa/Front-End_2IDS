<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POO - JavaScript</title>
</head>
    <body>
        <h1>POO - JavaScript</h1>
    </body>
    <script>
        class Carro{
            #marca;
            #modelo;

            constructor(marca, modelo){
                this.#marca = marca;
                this.#modelo = modelo;
            }

            getModelo(){
                return this.#modelo;
            }

            getMarca(){
                return this.#marca;
            }

            setModelo(modelo){
                this.#modelo = modelo;
            }

            setMarca(marca){
                this.#marca = marca;
            }
        }

        let carro1 = new Carro();
        carro1.setModelo(`F250 Turbo`);
        carro1.setMarca(`Ford`);
        console.log(`O carro é da marca ${carro1.getMarca()} e o modelo ${carro1.getModelo()}`)
        
        let carro2 = new Carro();
        carro2.setModelo(prompt(`Digite o modelo do carro: `));
        carro2.setMarca(prompt(`Digite o marca do carro: `));
        console.log(`O carro é da marca ${carro2.getMarca()} e o modelo ${carro2.getModelo()}`)
        </script>
</html>
