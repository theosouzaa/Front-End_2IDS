<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 03 - DOM</title>
</head>
<body>
    <h1>Página com JavaScript</h1>

    <!-- Exibindo alertas -->
    <button onclick="exibirAlerta()">Clique aqui!</button>
    <button onmouseover="exibirAlerta()">Passe com o mouse aqui!</button>
    
    <!-- Validando campos -->
    <input type="text" id="nome" placeholder="Digite seu nome">
    <input type="text" id="cpf" placeholder="Digite seu CPF">
    <button onclick="validarNome()">Validar Campo Nome</button>

</body>
<script>
    function exibirAlerta() {
        alert("Olá! Você clicou no botão.");
    }

    function validarNome(){
        let nome = document.getElementById("nome").value;
        let cpf = document.getElementById("cpf").value;

        console.log(nome);
        console.log(cpf);

        if(!nome || !cpf){
            alert("Os campos nome e CPF são obrigatórios!");
        }

        // if(!cpf){
        //     alert("O campo CPF é obrigatório!");
        // }

        alert("Os campos foram preenchidos com sucesso!");

    }
</script>
</html>
