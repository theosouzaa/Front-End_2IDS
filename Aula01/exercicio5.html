<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raiz quadrada com JavaScript</title>
</head>
<body>
    <h1>Raiz quadrada com JavaScript</h1>
</body>
<script>
    let numero = parseInt(prompt("Digite um número inteiro e positivo: "));

        if (numero > 0) {
            resultado = Math.sqrt(numero);
            console.log (`O numero digitado é: ${numero}. Já a raiz quadrada é: ${resultado}`);
            alert (`O numero digitado é: ${numero}. Já a raiz quadrada é: ${resultado}`)
        } else {
            console.log (`Erro! O número que você digitou não é inteiro nem positivo.`)
            alert ("Erro! O número que você digitou não é inteiro nem positivo.")
        }

</script>
</html>
