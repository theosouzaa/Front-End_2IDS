<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário com Sweet Alert</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .container {
        background: white;
        padding: 30px;
        border-radius: 16px;
        width: 100%;
        max-width: 400px;
        box-shadow: 0 10px 30px rgb(69, 60, 60);
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
    }

    .form-group {
        margin-bottom: 15px;
    }

    label {
        display: block;
        margin-bottom: 5px;
        color: #555;
        font-size: 14px;
    }

    input {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
        font-size: 14px;
    }

    input:focus {
        border-color: #667eea;
        outline: none;
    }

    .botao {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: white;
        cursor: pointer;
    }

    .baixo {
        font-size: 12px;
        color: #888;
    }
</style>

<body>
    <div class="container">
        <h2>Cadastro de Usuário</h2>

        <form onsubmit="enviarFormulario(event)">
            <div class="form-group">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
            </div>

            <div class="form-group">
                <label for="idade">Idade</label>
                <input type="number" id="idade" name="idade" placeholder="Digite sua idade">
            </div>

            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="number" id="cpf" name="cpf" placeholder="000.000.000-00">
                <div>Formato: 000.000.000-00</div>
            </div>

            <div class="form-group">
                <label for="dataNascimento">Data de nascimento</label>
                <input type="date" id="dataNascimento" name="dataNascimento">
            </div>

            <button type="submit" class="botao">Cadastrar</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        function enviarFormulario() {
            // Bloqueia o envio automatico do form pelo HTML
            event.preventDefault()

            let nome = document.getElementById('nome').value;
            let idade = document.getElementById('idade').value;
            let cpf = document.getElementById('cpf').value;
            let dataNascimento = document.getElementById('dataNascimento').value;

            if (!nome || !idade || !cpf || !dataNascimento) {
                Swal.fire({
                    title: "Aenção!",
                    text: "Todos os campos devem ser preenchidos!",
                    icon: "error"
                });

                return;
            }

            if (idade < 18) {
                Swal.fire({
                    title: "Aenção!",
                    text: "Você precisa ser maior de idade!",
                    icon: "error"
                });

                return;
            }

            Swal.fire({
                title: "Sucesso!",
                text: "Sucesso ao cadastrar dados!",
                icon: "sucsess"
            });
        }
    </script>
</body>
</html>
