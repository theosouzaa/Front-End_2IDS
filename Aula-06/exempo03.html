<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 3 - Anúncios</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    }
    html, body{
        height: 100%;
    }

    body{
        display: flex;
        flex-direction: column;
    }

    header{
        background-color: red;
        padding: 15px;
        text-align: center;
        color: white;
    }

    .conteudo{
        flex: 1;
        display: flex;
        flex-wrap: wrap;
        overflow: auto;
    }

    .menu{
        width: 20%;
        text-align: center;
    }

    .menu a{
        background-color: bisque;
        padding: 8px;
        margin-top: 7px;
        display: block;
        width: 100%;
        color: black;
    }

    .principal{
        width: 60%;
        padding: 0 20px;
    }

    .anuncios{
        background-color: bisque;
        width: 20%;
        padding: 15px;
        margin-top: 7px;
        text-align: center;
    }

    footer{
        background-color: red;
        text-align: center;
        color: white;
    }


    @media (max-width: 620px){
        .menu, .principal, .anuncios{
            width: 100%;
        }
    }

</style>
<body>
    <header>
        <h1>Logo do Site</h1>
    </header>
    
    <div class="conteudo">
        <div class="menu">
            <a href="">Menu 1</a>
            <a href="">Menu 2</a>
            <a href="">Menu 3</a>
            <a href="">Menu 4</a>
        </div>

        <div class="principal">
            <h2>Conteúdo da página</h2>
            <p>Texto do Site!</p>
        </div>

        <div class="anuncios">
            <h2>Anúncios</h2>
            <p>Sonho do Théo é ser programador Front-End</p>
            <p>Irmão do Théo é programador Back-End</p>
        </div>

    </div>

    <footer>
        &copy; 3°B SENAI
    </footer>
</body>
</html>
