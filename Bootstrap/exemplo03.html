<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Bootstrap</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <!-- Incluindo NavBar -->
    <nav class="navbar navbar-expand-lg bg-danger">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="#">Cardápio do SESI</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link text-white" aria-current="page" href="#">Café da manhã</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#">Almoço</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white" href="#">Café da tarde</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- Informações da página -->
    <div class="container">
        <div class="row text-center mt-2">
            <h1>Almoço de hoje</h1>
        </div>

        <!-- Segunda linha -->
        <div class="row">
            <div class="alert alert-danger" role="alert">
                Omelete com queijo e tomate.
            </div>
        </div>

        <!-- terceira linha -->
        <div class="row">
            <div class="card" style="width: 18rem;">
                <img src="https://www.receiteria.com.br/wp-content/uploads/omelete-de-forno-sem-farinha.jpg"
                    class="card-img-top" alt="...">
                <div class="card-body">
                    <p class="card-text">Omelete de forno, com queijo e tomate</p>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <h5>Formulário para almoçar no SESI</h5>
            <form>
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Email</label>
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                </div>
                <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Nome Completo</label>
                    <input type="password" class="form-control" id="exampleInputPassword1">
                </div>
                <button type="submit" class="btn btn-danger col-md-12">Enviar</button>
            </form>
        </div>

        <!-- Button trigger modal -->
        <button type="button" class="btn btn-danger mt-4 col-md-12" data-bs-toggle="modal" data-bs-target="#exampleModal">
            Clique aqui para saber o café da tarde!
        </button>

        <!-- Modal -->
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5" id="exampleModalLabel">Café da tarde</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        Pão com mortadela e suco e suco de manga
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Quero pão com mortadela</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
