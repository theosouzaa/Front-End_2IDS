<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container - Rows - col</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
    <body>
        <!-- Container para alinhamento da página -->
        <div class="container">
            <!-- Primeira linha da página -->
             <div class="row">
                <h2>Primeira Linha</h2>
             </div>

             <!-- Segunda linha da página -->
            <div class="row">
                <div class="col-4 bg-danger">Coluna 4</div>
                <div class="col-4 bg-success">Coluna 4</div>
                <div class="col-3 bg-primary">Coluna 3</div>
                <div class="col-1 bg-warning">Coluna 4</div>
             </div>
             <!-- Terceira linha da página -->
              <div class="row mt-2">
                <div class="col-6 bg-info">Coluna 6</div>
                <div class="col-4 bg-secondary">Coluna 6</div>
              </div>
            <!-- Quarta linha da página -->
              <div class="row mt-2">
                <h2>Coluna responsiva</h2>
              </div>
            <!-- Quinta linha da página -->
              <div class="row">
                <div class="col-md-3 bg-warning">Coluna 3</div>
                <div class="col-md-3 bg-primary">Coluna 3</div>
                <div class="col-md-3 bg-success">Coluna 3</div>
                <div class="col-md-3 bg-danger">Coluna 3</div>
              </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
