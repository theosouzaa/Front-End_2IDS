<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<style>
    body{
    font-family: Arial, Helvetica, sans-serif;
    padding: 20px;
}

/* Classe do alto contraste */
.alto-contraste{
    background-color: black;
    color: yellow;
}

/* Personalização botões */
button{
    padding: 10px;
    cursor: pointer;
    background-color: yellow;
    color: black;
    background-color: 2px solid yellow;
}

/* Modo de Leitura */
.modo-leitura{
    background-color: rgb(208, 208, 208);
    font-size: 25px;
    color: black;
}

/* Ajuste fonte */
.aumentar-fonte{
    font-size: 26px;
}

.diminuir-fonte{
    font-size: 14px;
}
</style>

<body>
    <!-- Informações da página -->
    <div class="container">
        <!-- Segunda linha -->
        <div class="row mt-2">
            <div class="alert alert-danger text-center" role="alert">
                Passe as informações para validar o formulário.
            </div>
        </div>

        <header>
            <button id="contraste-btn" onclick="altoContraste()">Alto Contraste</button>
            <button id="leitura-btn" onclick="modoLeitura()">Modo Leitura</button>
            <button id="aumentar-btn" onclick="aumentarFonte()">Aumentar Fonte</button>
            <button id="diminuir-btn" onclick="diminuirFonte()">Diminuir Fonte</button>
            <button id="ler-btn" onclick="lerConteudo()">Ler Conteúdo</button>
        </header>

        <form onsubmit="enviarFormulario(event)">
            <div class="row mt-4">
                <h4>Cadastro de Alunos</h4>
                <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Nome Completo</label>
                    <input type="text" class="form-control" name="nome" id="nome">
                </div>
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Email</label>
                    <input type="email" class="form-control" name="email" id="email" aria-describedby="emailHelp">
                </div>
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">CPF</label>
                    <input type="number" class="form-control" name="cpf" id="cpf" aria-describedby="emailHelp">
                </div>
                <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Telefone</label>
                    <input type="number" class="form-control" name="telefone" id="telefone">
                </div>
                <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Data de Nascimento</label>
                    <input type="date" class="form-control" name="dataNascimento" id="dataNascimento">
                </div>
                <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label col-md-6">Curso escolhido</label><br>
                    <select name="cursos" id="cursos">
                        <option value="">Técnico em Administração</option>
                        <option value="">Técnico em Manutenção Automotiva</option>
                        <option value="">Técnico em Mecânica</option>
                        <option value="">Técnico em Automação Industrial</option>
                        <option value="">Técnico em Cibersistemas para Automação</option>
                        <option value="">Técnico em Equipamentos Biomédicos</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-danger col-md-12 mb-3">Enviar</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>


    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>

        // Função do alto contraste
        function altoContraste() {
            document.body.classList.toggle('alto-contraste')
        }

        // Função modo leitura
        function modoLeitura() {
            document.body.classList.toggle('modo-leitura');
        }

        // Mudar a fonte das letras

        // Aumentar
        function aumentarFonte() {
            // Adiciona classe de aumentar fonte
            document.body.classList.add('aumentar-fonte');
            document.body.classList.remove('diminuir-fonte');
        }

        // Diminuir
        function diminuirFonte() {
            // Adiciona classe de diminuir fonte
            document.body.classList.add('diminuir-fonte');
            document.body.classList.remove('aumentar-fonte');
        }

        function enviarFormulario() {
            // Bloqueia o envio automatico do form pelo HTML
            event.preventDefault()

            let nome = document.getElementById('nome').value;
            let email = document.getElementById('email').value;
            let cpf = document.getElementById('cpf').value;
            let telefone = document.getElementById('telefone').value;

            let dataNascimento = document.getElementById('dataNascimento').value;

            if (!nome || !email || !telefone || !cpf || !dataNascimento) {
                Swal.fire({
                    title: "Aenção!",
                    text: "Todos os campos devem ser preenchidos!",
                    icon: "error"
                });

                return;
            }

            Swal.fire({
                title: "Sucesso!",
                text: "Sucesso ao cadastrar dados!",
                icon: "success"
            });
        }
    </script>
</body>
</html>
